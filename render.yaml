services:
  - type: web
    name: rentlogg-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: rentlogg-data
      mountPath: /var/data
      sizeGB: 1
    # sync: false means "the value lives in Render's dashboard, not in this file" — these are
    # secrets or environment-specific, and listing them here is what keeps a rebuilt service from
    # silently coming up without them. Adding a var to the code without adding it here is how
    # REPORT_FROM_EMAIL went missing on the first live Resend send.
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/rentlogg.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Daily report digest (services/mailer.js, sent 07:00 Europe/Oslo). No fallback: without the
      # key, every send throws.
      - key: RESEND_API_KEY
        sync: false
      # Must be a sender address verified on the rentlogg.no domain in Resend.
      - key: REPORT_FROM_EMAIL
        sync: false
      # Optional. Enables AI PDF import for room checklists (POST /sites/:id/rooms/import-pdf);
      # unset, that one endpoint returns a clean "not configured" error instead of crashing.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Comma-separated frontend origins allowed to call this API. Left unset, CORS answers every
      # origin with "*", which is what production did until now.
      #
      # BEGGE verdiene må stå her, og www-varianten er den som faktisk brukes: rentlogg.no svarer
      # 308 og sender nettleseren videre til www.rentlogg.no, så det er www som står i Origin-
      # headeren på hvert eneste API-kall. Setter man bare apex-domenet — den åpenbare verdien —
      # blokkerer nettleseren alt, og appen er nede for alle. Apex står med fordi oppsettet har
      # snudd før: rentlogg.no ble en periode servert direkte av Vercel uten omdirigering.
      #
      # Merk at dette ikke er tilgangskontroll. Auth er en Bearer-header, ikke en cookie, så en
      # fremmed origin har aldri kunnet ri på en ambient credential uansett, og hvem som helst kan
      # fortsatt kalle API-et utenfor en nettleser. Dette hever terskelen for en phishing-klone som
      # vil logge inn mot ekte backend fra nettleseren, og er på plass før noen eventuelt innfører
      # cookies senere. Ikke mer enn det.
      - key: ALLOWED_ORIGINS
        value: https://www.rentlogg.no,https://rentlogg.no
      # Where GET /checkin/:qrToken sends a native-camera QR scan on to. Defaults to
      # https://rentlogg.no, which 308-redirects to https://www.rentlogg.no/ — works, one hop extra.
      - key: PUBLIC_FRONTEND_URL
        sync: false
      # What a printed QR sticker encodes as its own base. Falls back to Render's own
      # RENDER_EXTERNAL_URL, so it only needs setting if the API ever moves to a custom domain.
      - key: PUBLIC_BASE_URL
        sync: false
